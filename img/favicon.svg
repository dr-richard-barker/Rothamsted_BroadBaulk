<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="50" cy="50" r="46" fill="#fefce8" stroke="#ca8a04" stroke-width="3"/>
  <!-- Central stem -->
  <path d="M 50 86 Q 48 50 50 16" stroke="url(#stemGrad)" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- Wheat grains / kernels -->
  <!-- Bottom pair -->
  <ellipse cx="40" cy="66" rx="8" ry="4" transform="rotate(-35 40 66)" fill="url(#goldGrad)" />
  <ellipse cx="60" cy="66" rx="8" ry="4" transform="rotate(35 60 66)" fill="url(#goldGrad)" />
  <!-- Middle-lower pair -->
  <ellipse cx="38" cy="53" rx="8" ry="4" transform="rotate(-35 38 53)" fill="url(#goldGrad)" />
  <ellipse cx="62" cy="53" rx="8" ry="4" transform="rotate(35 62 53)" fill="url(#goldGrad)" />
  <!-- Middle pair -->
  <ellipse cx="40" cy="40" rx="8" ry="4" transform="rotate(-35 40 40)" fill="url(#goldGrad)" />
  <ellipse cx="60" cy="40" rx="8" ry="4" transform="rotate(35 60 40)" fill="url(#goldGrad)" />
  <!-- Middle-upper pair -->
  <ellipse cx="42" cy="28" rx="7" ry="3.5" transform="rotate(-30 42 28)" fill="url(#goldGrad)" />
  <ellipse cx="58" cy="28" rx="7" ry="3.5" transform="rotate(30 58 28)" fill="url(#goldGrad)" />
  <!-- Top grain -->
  <ellipse cx="50" cy="18" rx="6" ry="3.5" transform="rotate(-90 50 18)" fill="url(#goldGrad)" />
  <!-- Awns (bristles) -->
  <path d="M 50 15 L 50 7" stroke="#b45309" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 44 26 L 35 12" stroke="#b45309" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 56 26 L 65 12" stroke="#b45309" stroke-width="1.5" stroke-linecap="round"/>
</svg>
