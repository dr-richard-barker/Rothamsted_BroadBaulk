name: Update Weather & Climate Data

on:
  schedule:
    # Run at 06:00 UTC on the 1st of every month
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r data-pipeline/requirements.txt

      - name: Run Weather Data Fetcher
        run: |
          python data-pipeline/fetch_climate_data.py

      - name: Run CO₂ Composite Builder
        run: |
          python data-pipeline/build_co2_composite.py

      - name: Commit and push if updated
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(data): automated monthly weather and CO2 update"
          file_pattern: "data/climate/*"
